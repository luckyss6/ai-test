name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/astock-linux-amd64     ./cmd/astock
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/astock-windows-amd64.exe ./cmd/astock
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -o dist/astock-darwin-amd64    ./cmd/astock
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -o dist/astock-darwin-arm64    ./cmd/astock

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
