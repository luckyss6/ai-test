<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A 股数据看板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>A 股数据看板</h1>
    <p id="updated">加载中…</p>
  </header>

  <main>
    <section class="panel">
      <h2>标的行情</h2>
      <div class="table-wrap">
        <table id="quote-table">
          <thead>
            <tr>
              <th>名称</th>
              <th>代码</th>
              <th>日期</th>
              <th>收盘</th>
              <th>涨跌</th>
              <th>涨跌幅</th>
              <th>最高</th>
              <th>最低</th>
              <th>成交量(手)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>收盘走势 <select id="symbol-select"></select></h2>
      <canvas id="chart" height="360"></canvas>
      <p class="hint">点击上方表格任意一行可切换标的。</p>
    </section>
  </main>

  <footer>数据来源：腾讯行情公开接口 · 仅供学习研究，不构成投资建议</footer>

  <script src="app.js"></script>
</body>
</html>
